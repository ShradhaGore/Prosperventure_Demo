---
- name: Configure Local Machine
  hosts: local
  connection: local
  become: true
  become_method: sudo
  gather_facts: true

  tasks:
    - name: Update apt cache
      apt:
        update_cache: yes

    - name: Install Git
      apt:
        name: git
        state: present

    - name: Install Docker
      apt:
        name: docker.io
        state: present
